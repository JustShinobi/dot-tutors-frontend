name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The build must not depend on a reachable backend; these only fill the public URLs.
  NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000"
  NEXT_PUBLIC_APP_BASE_URL: "http://localhost:3000"

jobs:
  quality:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Types
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        # The build is part of the gate, not an afterthought: a Server/Client Component mistake
        # passes `tsc` and only fails here.
        run: pnpm build
