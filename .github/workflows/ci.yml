name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The build must not depend on a reachable backend; these only fill the public URLs.
  NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000"
  NEXT_PUBLIC_APP_BASE_URL: "http://localhost:3000"

jobs:
  quality:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Types
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        # The build is part of the gate, not an afterthought: a Server/Client Component mistake
        # passes `tsc` and only fails here.
        run: pnpm build

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end (iframe)
        # Proves acceptance criterion 7.3 through a real cross-document iframe. The backend is
        # stubbed, so nothing here depends on a live API or on model credentials.
        run: pnpm test:e2e

      - name: Upload the report when the E2E fails
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  image:
    name: Container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The deployed app is this image, so it is built on every push rather than being a file
    # nobody ever ran. `NEXT_PUBLIC_*` values are inlined at build time, which is exactly the
    # kind of thing that only breaks once you try to build it.
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: dot-tutors-frontend:ci
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
            NEXT_PUBLIC_APP_BASE_URL=http://localhost:3000
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image starts and serves a page
        run: |
          docker run -d --name web -p 3000:3000 dot-tutors-frontend:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/ > /dev/null; then
              echo "o frontend respondeu na tentativa $attempt"
              docker rm -f web
              exit 0
            fi
            sleep 2
          done
          echo "o frontend nao subiu"
          docker logs web
          exit 1
